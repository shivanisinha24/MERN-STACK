<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
      /* Code for Propagation */
      #grand-parent {
        width: 300px;
        height: 300px;
        background-color: rgb(213, 37, 37);
      }
      #parent {
        width: 200px;
        height: 200px;
        background-color: rgb(200, 119, 119);
      }
      #child {
        width: 100px;
        height: 100px;
        background-color: rgb(162, 223, 7);
      }
      #grand-child {
        width: 50px;
        height: 50px;
        background-color: rgb(10, 187, 206);
      }
      #grand-parent,
      #parent,
      #child,
      #grand-child {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h3>Another Example</h3>
    <div id="grand-parent">
      <div id="parent">
        <div id="child">
          <div id="grand-child"></div>
        </div>
      </div>
    </div>
    <h3>Here is the Link</h3>
    <a href="https://github.com/Laxman67">Click Here </a>
  <script>
    let grandparent = document.getElementById('grand-parent');
    let parent = document.getElementById('parent');
    let child = document.getElementById('child');
    let grandchild = document.getElementById('grand-child')
    grandparent.addEventListener('click', (e) => {
      e.stopPropagation();
        console.log(e.type)
        console.log(e.target)
        console.log('Grand Parent is Cliked')
      });
    parent.addEventListener ('click', () => {
        console.log('Parent is Cliked')
      });
    child.addEventListener ('click', () => {
        console.log('child is Cliked')
      });
    grandchild.addEventListener ('click', (e) => {
      e.stopPropagation()
        console.log('Grand child is Cliked');
      });
  </script>
</body>
</html>
