<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>product card</title>
  <style>
    #container{
      width: 500px;
      height:650px;
      border-radius: 20px;
      box-sizing: border-box;
      box-shadow: 2px 2px 5px gray;
      margin:10vw
    }
    .img-container{
      position: relative;
    }
    .details{
      margin: 20px;
    }
    .details{
      margin:20px;
    }
    h2{
      text-transform: uppercse;
      font-family:
      'Lucida Grande','Lucida Sans Unocode',Geneva, 
      Verdana, Geneva, Tahoma, sans-serif;
      color:rgb(225,151,59);
    }
    h3{
      background-color: rgb(41, 35, 21);
      color: beige;
      width:40%;
      text-align: center;
      border-radius: 20px;
      padding: 2px;
    }
    p{
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    .img-container{
      position:relative;
    }
    .like-box{
      position: absolute;
      top:20px;
      left:20px;
      padding:15px;
      border-radius:50%;
      background-color: white;
    }
  </style>
</head>
<body>
  <article id="container">
    <section class="img-container">
      <div class="like-box">❤️</div>
      <img src="https://img.magnific.com/free-photo/fashion-shoes-sneakers_1203-7529.jpg?semt=ais_hybrid&w=740&q=80" 
      alt="product image" width="100%" style="border-radius: 20px 20px 0px 0px"    
    />
    </section>
    <!--section 2--->
    <section class="details">
      <h2>Nike Shoes</h2>
      <h3>$45.00 USD</h3>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem rerum numquam nostrum.
      </p>
    </section>  
  </article>
</body>
</html>
