<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphism Profile Card</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div class="profile-card">
    <div class="profile-pic">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNOX3Ml6mK2x98I3FYVaT2Zu-FmvZ0cPK5YQ&s" alt="Profile Picture">
    </div>
    <h2>CodingNepal</h2>
    <p>Designer & Developer</p>

    <div class="social-icons">
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-leetcode"></i></a>
    </div>

    <div class="buttons">
      <button>Message</button>
      <button>Subscribe</button>
    </div>

    <div class="stats">
      <div><i class="far fa-heart">❤️</i> 20.4k</div>
      <div><i class="far fa-comment">💬</i> 14.3k</div>
      <div><i class="fas fa-share"></i> 12.8k</div>
    </div>
  </div>

  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
